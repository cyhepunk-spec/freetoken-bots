name: FreeToken daily scan

on:
  schedule:
    - cron: '0 0 * * *'  # 08:00 SGT daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scan
        run: |
          mkdir -p ~/.pi/agent
          cp freetoken-bots.json ~/.pi/agent/freetoken-bots.json
          cp freetoken-bots.json /tmp/old.json
          python3 scripts/radar.py scan
          cp ~/.pi/agent/freetoken-bots.json freetoken-bots.json
      - name: Compare (ignore checked_at)
        id: compare
        run: |
          python3 - <<'PY'
          import json
          def canon(path):
              d = json.load(open(path))
              d.pop('checked_at', None)
              return d
          changed = canon('/tmp/old.json') != canon('freetoken-bots.json')
          with open('/tmp/changed.txt', 'w') as f:
              f.write('true' if changed else 'false')
          print('changed:', changed)
          PY
          echo "changed=$(cat /tmp/changed.txt)" >> "$GITHUB_OUTPUT"
      - name: Commit updated report
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name 'freetoken-bots'
          git config user.email 'freetoken-bots@users.noreply.github.com'
          git add freetoken-bots.json
          git commit -m 'FreeToken scan: free-model list changed'
          git push
      - name: Open issue on change
        if: steps.compare.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('freetoken-bots.json', 'utf8'));
            const body = `FreeToken daily scan detected a change in the free-model list.\n\nfree_count: ${report.free_count}\nchecked_at: ${report.checked_at}\n\nSee the latest commit for the full report diff.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `FreeToken scan: free-model list changed (${report.checked_at.slice(0, 10)})`,
              body
            });
